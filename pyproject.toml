[project]
name = "mail-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.141.1",
    "fastmcp>=3.4.4",
    "google>=3.0.0",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.0",
    "google-auth-oauthlib>=1.4.0",
    "grandalf>=0.8",
    "ipykernel>=7.3.0",
    "langchain>=1.3.11",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.5.1",
    "langgraph>=1.2.7",
    "langsmith>=0.9.7",
    "mcp>=1.28.1",
    "ollama>=0.6.2",
    "prompt-toolkit>=3.0.52",
    "questionary>=2.1.1",
    "textual-dev>=1.8.0",
    "typer>=0.26.8",
]

[dependency-groups]
dev = [
    "ruff>=0.15.18",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_agent"]

[project.scripts]
mail-agent = "mail_agent.cli.main:app"


